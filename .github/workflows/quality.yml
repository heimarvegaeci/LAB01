name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check documentation
      run: |
        echo "Checking documentation completeness..."
        # Verify required documentation files exist
        required_files=(
          "README.md"
          "CONTRIBUTING.md"
          "LICENSE"
          "docs/MAINTENANCE.md"
          "docs/TECHNICAL_DEBT.md"
        )
        
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Required file missing: $file"
            exit 1
          else
            echo "✅ Found: $file"
          fi
        done
        
    - name: Lint documentation
      run: |
        echo "Linting Markdown files..."
        # Check for common markdown issues
        find . -name "*.md" -type f | while read file; do
          if [ -s "$file" ]; then
            echo "✅ $file is not empty"
          else
            echo "❌ $file is empty"
            exit 1
          fi
        done
        
    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for technical debt markers..."
        todo_count=$(grep -r "TODO\|FIXME\|HACK\|XXX" --include="*.md" --include="*.txt" . | wc -l || true)
        echo "Found $todo_count technical debt markers"
        if [ "$todo_count" -gt 10 ]; then
          echo "⚠️ High number of technical debt markers found. Consider addressing some."
        else
          echo "✅ Technical debt markers within acceptable range"
        fi
        
    - name: Validate project structure
      run: |
        echo "Validating project structure..."
        
        # Check if .gitignore exists and has content
        if [ -f ".gitignore" ] && [ -s ".gitignore" ]; then
          echo "✅ .gitignore file exists and has content"
        else
          echo "❌ .gitignore file missing or empty"
          exit 1
        fi
        
        # Check documentation structure
        if [ -d "docs" ]; then
          echo "✅ Documentation directory exists"
        else
          echo "❌ Documentation directory missing"
          exit 1
        fi
        
    - name: Report results
      if: always()
      run: |
        echo "Quality check completed!"
        echo "Repository follows technical debt management best practices."